name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  github-app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.22.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck -w app
      - run: npm run lint -w app
      - run: npm run build -w app
      - run: npm test -w app
      - run: npm run precision

  github-app-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f app/Dockerfile -t ai-codeguard-app:ci .
      - name: Container health smoke (synthetic credentials, no external API)
        run: |
          docker run -d --name codeguard-app -p 127.0.0.1:3000:3000 \
            -e APP_ID=1 -e PRIVATE_KEY=offline-test -e WEBHOOK_SECRET=offline-secret \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            -e ALLOWED_REPOSITORIES=owner/repo ai-codeguard-app:ci
          for attempt in $(seq 1 20); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/healthz || true)
            if [ "$status" = 200 ]; then echo "health HTTP=$status"; exit 0; fi
            sleep 1
          done
          exit 1
      - name: Reject unsigned webhook
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X POST --data '{}' http://127.0.0.1:3000/webhook)
          test "$status" = 401
          echo "unsigned webhook HTTP=$status"
      - name: Verify container isolation
        run: |
          test "$(docker exec codeguard-app id -u)" != 0
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' codeguard-app)" = true
          docker inspect -f 'user={{.Config.User}} readonly={{.HostConfig.ReadonlyRootfs}} tmpfs={{json .HostConfig.Tmpfs}}' codeguard-app
          docker exec codeguard-app node --input-type=module -e '
            import {writeFile, unlink} from "node:fs/promises";
            if (process.getuid() === 0) throw new Error("root user");
            try { await writeFile("/opt/codeguard/root-write-probe", "probe"); throw new Error("root writable"); }
            catch (error) { if (error.code !== "EROFS") throw error; }
            await writeFile("/tmp/tmpfs-probe", "probe");
            await unlink("/tmp/tmpfs-probe");
            console.log(JSON.stringify({uid:process.getuid(),rootWrite:"EROFS",tmpWrite:"passed"}));
          '
      - name: Check runtime dependencies and wasm with a static scan
        run: docker exec -i codeguard-app node --input-type=module < scripts/check-runtime.mjs
      - if: always()
        run: docker rm -f codeguard-app || true

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.22.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit complete and production dependency trees
        run: |
          npm audit --registry=https://registry.npmjs.org
          npm audit --omit=dev --registry=https://registry.npmjs.org

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run

  # Smoke-tests the composite action itself (action.yml), which the unit
  # suite cannot cover: vulnerable fixtures must yield findings and a valid
  # SARIF file; safe fixtures must yield zero findings and exit 0.
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan vulnerable fixtures with the local action
        id: vulnerable
        uses: ./
        with:
          paths: tests/fixtures/vulnerable
          output-file: smoke-vulnerable.sarif
          fail-on-findings: 'false'

      - name: Assert vulnerable scan produced findings and valid SARIF
        env:
          FINDINGS: ${{ steps.vulnerable.outputs.findings-count }}
          SARIF_FILE: ${{ steps.vulnerable.outputs.sarif-file }}
        run: |
          set -euo pipefail
          echo "findings-count=$FINDINGS sarif-file=$SARIF_FILE"
          test -f "$SARIF_FILE"
          [ "$FINDINGS" -gt 0 ]
          node -e '
            const sarif = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const driver = sarif.runs?.[0]?.tool?.driver;
            if (sarif.version !== "2.1.0") throw new Error("unexpected SARIF version");
            if (driver?.name !== "AI-CodeGuard") throw new Error("unexpected driver name");
            if (!driver?.version) throw new Error("missing driver version");
            if ((sarif.runs[0].results ?? []).length === 0) throw new Error("no results");
          ' "$SARIF_FILE"

      - name: Scan safe fixtures with the local action (must pass)
        id: safe
        uses: ./
        with:
          paths: tests/fixtures/safe
          output-file: smoke-safe.sarif
          fail-on-findings: 'true'

      - name: Assert safe scan reported zero findings
        env:
          FINDINGS: ${{ steps.safe.outputs.findings-count }}
        run: |
          set -euo pipefail
          echo "findings-count=$FINDINGS"
          [ "$FINDINGS" -eq 0 ]
